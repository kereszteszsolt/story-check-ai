name: story-check-ai

services:
  app:
    build: .
    restart: "no"
    ports:
      - "127.0.0.1:${APP_PORT:-33070}:8080"
    environment:
      APP_BIND_ADDRESS: 0.0.0.0
      APP_PORT: 8080
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL_1: ${OLLAMA_MODEL_1:-}
      OLLAMA_MODEL_2: ${OLLAMA_MODEL_2:-}
      OLLAMA_MODEL_3: ${OLLAMA_MODEL_3:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_1: ${OPENROUTER_MODEL_1:-}
      OPENROUTER_MODEL_2: ${OPENROUTER_MODEL_2:-}
      OPENROUTER_MODEL_3: ${OPENROUTER_MODEL_3:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
