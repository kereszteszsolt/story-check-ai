spring.application.name=story-check-ai
server.address=${APP_BIND_ADDRESS:127.0.0.1}
server.port=${APP_PORT:8080}
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
server.tomcat.connection-timeout=10s
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=64KB
storycheck.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
storycheck.ai.ollama.models[0]=${OLLAMA_MODEL_1:}
storycheck.ai.ollama.models[1]=${OLLAMA_MODEL_2:}
storycheck.ai.ollama.models[2]=${OLLAMA_MODEL_3:}
storycheck.ai.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
storycheck.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
storycheck.ai.openrouter.models[0]=${OPENROUTER_MODEL_1:}
storycheck.ai.openrouter.models[1]=${OPENROUTER_MODEL_2:}
storycheck.ai.openrouter.models[2]=${OPENROUTER_MODEL_3:}
storycheck.ai.request-timeout-ms=${AI_REQUEST_TIMEOUT_MS:60000}
